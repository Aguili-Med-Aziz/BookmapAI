// Real Data System JAR - 100% REAL DATA ONLY
task realDataSystemJar(type: Jar) {
    archiveFileName = 'BookmapAI-RealDataSystem-5.4.0.jar'
    
    manifest {
        attributes(
            'Main-Class': 'com.bookmaai.web.SimpleRealDataServer',
            'Implementation-Title': 'BookmapAI Real Data System - 100% Real Data Only',
            'Implementation-Version': '5.4.0',
            'Implementation-Vendor': 'BookmapAI Research Team',
            'Built-Date': new Date().format('yyyy-MM-dd HH:mm:ss'),
            'Built-JDK': System.getProperty('java.version'),
            'Data-Source': 'REAL_BOOKMAP_FEEDS_ONLY',
            'Simulation-Mode': 'DISABLED',
            'Mock-Data': 'ELIMINATED',
            'Dashboard-URL': 'http://localhost:8080',
            'Real-Data-Only': 'true'
        )
    }
    
    // Include only real data components
    from sourceSets.main.output
    include 'com/bookmaai/core/RealDataOnlyManager.class'
    include 'com/bookmaai/core/RealDataSlidingWindow.class'
