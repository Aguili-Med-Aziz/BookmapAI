plugins {
    id 'java'
    id 'application'
}

repositories {
    mavenCentral()
    gradlePluginPortal()
}

dependencies {
    // Core Java dependencies
    implementation 'org.slf4j:slf4j-api:1.7.36'
    implementation 'ch.qos.logback:logback-classic:1.2.12'
    
    // JSON processing
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.15.2'
    implementation 'com.fasterxml.jackson.core:jackson-core:2.15.2'
    implementation 'com.fasterxml.jackson.core:jackson-annotations:2.15.2'
    implementation 'org.json:json:20230618'
    
    // Testing
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:4.11.0'
}

// Set Java version to 8 for compatibility with BookMap
sourceCompatibility = JavaVersion.VERSION_1_8
targetCompatibility = JavaVersion.VERSION_1_8

// Force Gradle to use Java 8 even if JAVA_HOME points to newer version
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
    }
}

// Set UTF-8 encoding for all tasks
tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
    
    // Exclude problematic files that require full Bookmap API
    exclude '**/com/trading/strategy/**'
    exclude '**/velox/api/layer1/layers/tradinghelper/**'
    exclude '**/velox/api/layer1/simpledemo/actions/**'
    exclude '**/velox/api/layer1/simpledemo/alerts/**'
    exclude '**/velox/api/layer1/simpledemo/averagepositionprice/**'
    exclude '**/velox/api/layer1/simpledemo/customevents/**'
    exclude '**/velox/api/layer1/simpledemo/dataeditor/**'
    exclude '**/velox/api/layer1/simpledemo/datarecording/**'
    exclude '**/velox/api/layer1/simpledemo/largeordersfilter/**'
    exclude '**/velox/api/layer1/simpledemo/localization/**'
    exclude '**/velox/api/layer1/simpledemo/markers/**'
    exclude '**/velox/api/layer1/simpledemo/multipleaccount/**'
    exclude '**/velox/api/layer1/simpledemo/screenspacepainter/**'
    exclude '**/velox/api/layer1/simpledemo/tradingmessages/**'
    exclude '**/velox/api/layer1/simpledemo/userdataindicator/**'
    exclude '**/velox/api/layer1/config/beans/**'
    exclude '**/velox/api/layer1/simplified/demo/**'
    exclude '**/velox/api/layer1/simpledemo/SimpleDemoAdapter.java'
    exclude '**/velox/api/layer1/simpledemo/SimpleDemoInstrumentInfo.java'
    exclude '**/velox/api/layer1/simpledemo/SimpleDemoSubscription.java'
    
    // REAL DATA ONLY: Exclude all test and simulation files
    exclude '**/com/bookmaai/test/**'
    exclude '**/BookmapAISimulator.java'
    exclude '**/RealTimeDashboardLauncher.java'
    exclude '**/QuickDashboardLauncher.java'
    exclude '**/DashboardLauncher.java'
    exclude '**/TelegramTest.java'
}

tasks.withType(Javadoc) {
    options.encoding = 'UTF-8'
}

// Main class for standalone execution - REAL DATA SYSTEM
application {
    mainClass = 'com.bookmaai.web.SimpleRealDataServer'
}

// Enhanced JAR configuration for Bookmap addon with Active Trading Sessions (REAL DATA ONLY)
jar {
    archiveBaseName = 'BookmapAI-ActiveSessions'
    archiveVersion = '5.4.0'
    
    manifest {
        attributes(
            // CRITICAL: Real Data System main class
            'Main-Class': 'com.bookmaai.web.SimpleRealDataServer',
            'Implementation-Title': 'BookmapAI Active Sessions Addon',
            'Implementation-Version': '5.4.0',
            'Implementation-Vendor': 'BookmapAI Research Team',
            'Built-Date': new Date().format('yyyy-MM-dd HH:mm:ss'),
            'Built-JDK': System.getProperty('java.version'),
            // Bookmap Layer1 addon identification
            'Layer1-Api-Version': '2',
            'Layer1-Strategy-Name': 'BookmapAI Complete Trading System',
            'Bookmap-Addon': 'true',
            'Addon-Type': 'Strategy'
        )
    }
    
    // Include all dependencies in the JAR
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    
    // Exclude duplicate files and problematic classes
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude 'META-INF/*.RSA', 'META-INF/*.SF', 'META-INF/*.DSA'
    exclude '**/com/trading/strategy/**'
    exclude '**/velox/api/layer1/layers/tradinghelper/**'
    exclude '**/velox/api/layer1/simpledemo/actions/**'
    exclude '**/velox/api/layer1/simpledemo/alerts/**'
    exclude '**/velox/api/layer1/simpledemo/averagepositionprice/**'
    exclude '**/velox/api/layer1/simpledemo/customevents/**'
    exclude '**/velox/api/layer1/simpledemo/dataeditor/**'
    exclude '**/velox/api/layer1/simpledemo/datarecording/**'
    exclude '**/velox/api/layer1/simpledemo/largeordersfilter/**'
    exclude '**/velox/api/layer1/simpledemo/localization/**'
    exclude '**/velox/api/layer1/simpledemo/markers/**'
    exclude '**/velox/api/layer1/simpledemo/multipleaccount/**'
    exclude '**/velox/api/layer1/simpledemo/screenspacepainter/**'
    exclude '**/velox/api/layer1/simpledemo/tradingmessages/**'
    exclude '**/velox/api/layer1/simpledemo/userdataindicator/**'
    exclude '**/velox/api/layer1/config/beans/**'
    exclude '**/velox/api/layer1/simplified/demo/**'
    exclude '**/velox/api/layer1/simpledemo/SimpleDemoAdapter.java'
    exclude '**/velox/api/layer1/simpledemo/SimpleDemoInstrumentInfo.java'
    exclude '**/velox/api/layer1/simpledemo/SimpleDemoSubscription.java'
    
    // Include resources
    from('src/main/resources') {
        include '**/*'
    }
}

// Enhanced JAR task specifically for BookmapAI with Active Trading Sessions (REAL DATA ONLY)
task bookmapAIJar(type: Jar) {
    archiveBaseName = 'BookmapAI-ActiveSessions'
    archiveVersion = '4.1.0'
    archiveClassifier = 'bookmap-addon'
    
    manifest {
        attributes(
            'Main-Class': 'com.bookmaai.core.BookmapAddonIntegration',
            'Implementation-Title': 'BookmapAI Enhanced - Bookmap Addon',
            'Implementation-Version': '2.0.0',
            'Implementation-Vendor': 'BookmapAI Research Team',
            'Built-Date': new Date().format('yyyy-MM-dd HH:mm:ss'),
            'Built-JDK': System.getProperty('java.version'),
            'Bookmap-Addon': 'true',
            'Dashboard-Port': '8080',
            'Auto-Launch-Dashboard': 'true',
            'Research-Validated': 'true',
            'Accuracy-Targets': 'OrderFlow:92%,VolumeImbalance:81%,Delta:78%,Combined:96%',
            'Supported-Timeframes': '1M,5M,15M,1H,4H,1D',
            'Components': 'MarketDataExtractor,SlidingWindowManager,AccuracyDashboard,WebServer,EnhancedAI'
        )
    }
    
    // Include all compiled classes (excluding problematic ones)
    from sourceSets.main.output
    exclude '**/com/trading/strategy/**'
    exclude '**/velox/api/layer1/layers/tradinghelper/**'
    exclude '**/velox/api/layer1/simpledemo/actions/**'
    exclude '**/velox/api/layer1/simpledemo/alerts/**'
    exclude '**/velox/api/layer1/simpledemo/averagepositionprice/**'
    exclude '**/velox/api/layer1/simpledemo/customevents/**'
    exclude '**/velox/api/layer1/simpledemo/dataeditor/**'
    exclude '**/velox/api/layer1/simpledemo/datarecording/**'
    exclude '**/velox/api/layer1/simpledemo/largeordersfilter/**'
    exclude '**/velox/api/layer1/simpledemo/localization/**'
    exclude '**/velox/api/layer1/simpledemo/markers/**'
    exclude '**/velox/api/layer1/simpledemo/multipleaccount/**'
    exclude '**/velox/api/layer1/simpledemo/screenspacepainter/**'
    exclude '**/velox/api/layer1/simpledemo/tradingmessages/**'
    exclude '**/velox/api/layer1/simpledemo/userdataindicator/**'
    exclude '**/velox/api/layer1/config/beans/**'
    
    // Include all dependencies
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    
    // Exclude duplicate META-INF files
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude 'META-INF/*.RSA', 'META-INF/*.SF', 'META-INF/*.DSA'
    
    // Include resources
    from('src/main/resources') {
        include '**/*'
    }
    
    doLast {
        println "📦 BookmapAI Enhanced JAR created: ${archiveFile.get().asFile.name}"
        println "📦 Size: ${(archiveFile.get().asFile.length() / 1024).intValue()} KB"
        println "📦 Ready for Bookmap addon deployment"
        println "📦 Installation: Copy to Bookmap addons folder"
        println "📦 Dashboard: Will auto-launch at http://localhost:8080"
        println ""
        println "📦 Enhanced Features:"
        println "   • Market Data Extraction with auto-detect open markets"
        println "   • Multi-timeframe sliding windows (1M-1D)"
        println "   • Individual accuracy tracking per component"
        println "   • Real-time web dashboard on localhost:8080"
        println "   • Pattern detection with separate panels"
        println "   • Research-validated accuracy targets"
    }
}

// Add new unified addon task
task unifiedBookmapAIJar(type: Jar) {
    archiveFileName = 'BookmapAI-Unified-2.0.0-bookmap-addon.jar'
    
    // ✅ FIX: Add proper manifest with multiple entry points
    manifest {
        attributes(
            'Main-Class': 'com.bookmaai.test.QuickDashboardLauncher',
            'Implementation-Title': 'BookmapAI Unified - Multiple Entry Points',
            'Implementation-Version': '2.0.0',
            'Implementation-Vendor': 'BookmapAI Research Team',
            'Built-Date': new Date().format('yyyy-MM-dd HH:mm:ss'),
            'Built-JDK': System.getProperty('java.version'),
            'Bookmap-Addon-Class': 'com.bookmaai.addon.UnifiedBookmapAIAddon',
            'Dashboard-Launcher': 'com.bookmaai.test.QuickDashboardLauncher',
            'Simple-Dashboard': 'com.bookmaai.test.DashboardLauncher',
            'Real-Time-Dashboard': 'com.bookmaai.test.RealTimeDashboardLauncher',
            'Addon-Integration': 'com.bookmaai.core.BookmapAddonIntegration',
            'Enhanced-Demo': 'com.bookmaai.core.EnhancedBookmapAIDemo',
            'Standalone-AI': 'com.bookmaai.core.BookmapAIStandalone',
            'Available-Entry-Points': 'QuickDashboardLauncher,DashboardLauncher,RealTimeDashboardLauncher,BookmapAddonIntegration,EnhancedBookmapAIDemo,BookmapAIStandalone'
        )
    }
    
    from sourceSets.main.output
    
    // Include only the unified addon and required core classes
    include 'com/bookmaai/addon/UnifiedBookmapAIAddon.class'
    include 'com/bookmaai/core/**'
    include 'com/bookmaai/config/**'
    include 'com/bookmaai/web/**'
    include 'com/bookmaai/test/**'
    include 'com/strategies/**'
    include 'com/trading/**'
    
    // ✅ FIX: Include ALL Bookmap API classes (velox/**) for addon to work
    include 'velox/**'
    
    // Exclude ONLY the old conflicting entry points (keep all other velox classes)
    exclude 'velox/api/layer1/simpledemo/BookmapAIAddon.class'
    exclude 'velox/api/layer1/simpledemo/BookmapAIStrategy.class'
    exclude 'velox/api/layer1/simpledemo/SimpleBookmapAI.class'
    exclude 'velox/BookmapAI.class'
    
    // ✅ Keep all other Bookmap API classes that are needed for @Layer1Attachable to work
    
    // Include original dashboard HTML
    from('bin/main') {
        include 'original-dashboard.html'
        into 'static'
    }
    
    // Include resources
    from sourceSets.main.resources
    
    // Add dependencies
    from configurations.compileClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    
    doLast {
        println "✅ BookmapAI Unified JAR created: ${archiveFileName.get()}"
        
