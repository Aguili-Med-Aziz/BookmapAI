# 📊 Bookmap AI System Configuration

# Application Info
spring.application.name=Bookmap AI System
spring.profiles.active=dev

# Server Configuration
server.port=8091

# Logging Configuration
logging.level.com.bookmaai=INFO
logging.level.root=WARN
logging.pattern.console=[Bookmap AI] %d{HH:mm:ss.SSS} %-5level %logger{35} - %msg%n

# Security (disable for internal use)
management.security.enabled=false
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

# File Upload Configuration (for CSV export)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Performance Settings
server.tomcat.max-threads=200
server.tomcat.min-spare-threads=10

# Memory Management
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# Analysis Engine Settings
bookmaai.analysis.max-symbols=50
bookmaai.analysis.data-retention-hours=24
bookmaai.analysis.cleanup-interval-minutes=60

# Tool Thresholds (from knowledge base)
bookmaai.tools.heatmap.density-threshold=2.0
bookmaai.tools.volume-dots.aggression-threshold=1.5
bookmaai.tools.cvd.trend-threshold=100.0
bookmaai.tools.vwap.deviation-threshold=0.001
bookmaai.tools.volume-profile.poc-threshold=0.8
bookmaai.tools.iceberg.size-threshold=500.0

# Performance Monitoring
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized 

